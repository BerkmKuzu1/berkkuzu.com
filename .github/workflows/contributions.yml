name: Contribution graph

# Rebuilds assets/contributions.svg from the GitHub contribution calendar and
# commits it, so the Activity panel on the home page stays current without the
# site depending on a third-party image host.

on:
  schedule:
    # 03:17 UTC daily. Off the hour on purpose — GitHub throttles cron jobs
    # that all pile up on :00.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/build-contributions.mjs"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node tools/build-contributions.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions.svg assets/contributions.json

          # --cached, not a plain diff: on the very first run these files are
          # untracked and a working-tree diff would report "nothing changed".
          if git diff --cached --quiet; then
            echo "No change in the contribution graph."
            exit 0
          fi

          git commit -m "chore: refresh contribution graph"
          git push
