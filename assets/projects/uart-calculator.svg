<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-labelledby="t d">
<title id="t">UART calculator: request, datapath and reply</title>
<desc id="d">The task's example. The request BA CD 00 10 00 20 00 49 arrives on rx_i and passes uart_rx, msg_rx, alu, msg_tx and uart_tx; the reply AB CD 00 30 58 leaves on tx_o, so 16 + 32 = 48. The self-checking testbench passes 7 of 7 cases in GHDL and Questa.</desc>
